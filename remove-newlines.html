    <!-- Main -->
    <main id="main-content" class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8 pb-24 md:pb-8">
        <div class="mb-6">
            <h1 class="text-2xl md:text-3xl font-bold mb-2 flex items-center gap-3"><span class="text-3xl">↩️</span>移除換行</h1>
            <p class="text-gray-600 dark:text-gray-400">將複製指令時產生的換行移除，合併為可直接執行的單行指令</p>
        </div>

        <div class="space-y-6">
            <!-- Input -->
            <section>
                <label for="input-text" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">貼上含有換行的指令</label>
                <textarea id="input-text" class="w-full p-4 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-y min-h-[200px] font-mono text-sm touch-target" placeholder="在這裡貼上被換行截斷的指令..." rows="8"></textarea>
            </section>

            <!-- Options -->
            <section class="bg-gray-100 dark:bg-gray-800 rounded-xl p-4">
                <h3 class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">合併模式</h3>
                <div class="flex flex-wrap gap-4">
                    <label class="inline-flex items-center gap-2 cursor-pointer">
                        <input name="join-mode" type="radio" value="trim" checked class="w-5 h-5 border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500">
                        <span class="text-sm text-gray-700 dark:text-gray-300">移除換行 + 去除行首空白</span>
                    </label>
                    <label class="inline-flex items-center gap-2 cursor-pointer">
                        <input name="join-mode" type="radio" value="raw" class="w-5 h-5 border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500">
                        <span class="text-sm text-gray-700 dark:text-gray-300">僅移除換行</span>
                    </label>
                </div>
            </section>

            <!-- Actions -->
            <div class="flex flex-wrap gap-3">
                <button onclick="joinLines()" class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition-colors touch-target flex-1 sm:flex-none">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                    合併
                </button>
                <button onclick="copyResult()" class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-medium rounded-xl transition-colors touch-target">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                    複製
                </button>
                <button onclick="clearAll()" class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 font-medium rounded-xl transition-colors touch-target">清除</button>
            </div>

            <!-- Output -->
            <section>
                <label for="output-text" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">合併結果</label>
                <textarea id="output-text" class="w-full p-4 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-100 dark:bg-gray-700 resize-y min-h-[120px] font-mono text-sm" readonly rows="4"></textarea>
            </section>

            <!-- Info -->
            <div class="bg-blue-50 dark:bg-blue-900/20 rounded-xl p-4 text-sm text-blue-800 dark:text-blue-200">
                <p class="font-medium mb-1">使用說明</p>
                <ul class="list-disc list-inside space-y-1 text-blue-700 dark:text-blue-300">
                    <li>適用於複製指令時被自動換行截斷的情況</li>
                    <li>「移除換行 + 去除行首空白」：移除每行前方空白後直接合併，適合被截斷的長指令</li>
                    <li>「僅移除換行」：只移除換行符號，保留所有空白</li>
                </ul>
            </div>

            <a href="pdf-to-png.html" class="flex flex-col items-center justify-center text-gray-600 dark:text-gray-400 touch-target"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg><span class="text-xs mt-0.5">圖片</span></a>
            <a href="encry.html" class="flex flex-col items-center justify-center text-blue-600 dark:text-blue-400 touch-target"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg><span class="text-xs mt-0.5 font-medium">開發</span></a>
            <button id="theme-toggle-mobile" class="flex flex-col items-center justify-center text-gray-600 dark:text-gray-400 touch-target"><svg class="w-6 h-6 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0z"/></svg><svg class="w-6 h-6 block dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg><span class="text-xs mt-0.5">主題</span></button>
        </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-24 md:bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 px-4 py-2 rounded-lg shadow-lg transform transition-all duration-300 opacity-0 translate-y-4 pointer-events-none z-[60]"><span id="toast-message"></span></div>

    <script>
        // Theme
        function toggleTheme() { const isDark = document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', isDark ? 'dark' : 'light'); }
        document.getElementById('theme-toggle-desktop')?.addEventListener('click', toggleTheme);
        document.getElementById('theme-toggle-mobile')?.addEventListener('click', toggleTheme);

        // Toast
        function showToast(msg, duration = 2000) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none'); toast.classList.remove('opacity-100', 'translate-y-0'); }, duration);
        }

        function joinLines() {
            const input = document.getElementById('input-text').value;
            if (!input.trim()) { showToast('請先貼上指令內容'); return; }

            const mode = document.querySelector('input[name="join-mode"]:checked').value;
            let result;

            if (mode === 'trim') {
                result = input.split(/\r?\n/).map(line => line.trimStart()).join('');
            } else {
                result = input.replace(/\r?\n/g, '');
            }

            document.getElementById('output-text').value = result;
            showToast('合併完成');
        }

        function clearAll() {
            document.getElementById('input-text').value = '';
            document.getElementById('output-text').value = '';
            showToast('已清除');
        }

        async function copyResult() {
            const output = document.getElementById('output-text').value;
            if (!output.trim()) { showToast('沒有內容可複製'); return; }
            try { await navigator.clipboard.writeText(output); showToast('已複製到剪貼簿'); }
            catch { showToast('複製失敗'); }
        }
    </script>
